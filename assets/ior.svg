<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">ior 拼音输入法</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11897f"/>
      <stop offset="1" stop-color="#0a4a4f"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcf7f2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#glow)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
  <!-- 拼音的“i”：圆点取朱砂，竖笔取留白 -->
  <circle cx="112" cy="86" r="20" fill="#ff8a4c"/>
  <rect x="92" y="122" width="40" height="86" rx="20" fill="url(#stem)"/>
  <!-- 候选条的轻提示，小尺寸下自然隐去 -->
  <g fill="#ffffff">
    <rect x="150" y="132" width="16" height="52" rx="8" opacity="0.34"/>
    <rect x="178" y="148" width="16" height="36" rx="8" opacity="0.16"/>
  </g>
</svg>
